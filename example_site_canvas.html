 used.forEach(n=>{const l=document.createElement('label');l.innerHTML=`<input type="checkbox" checked><span class="sw" style="background:${(sh.layers[n]||['#000'])[0]}"></span>${n}`;l.querySelector('input').onchange=e=>{e.target.checked?hidden.delete(n):hidden.add(n);draw()};ly.appendChild(l)});
 document.getElementById('nt').innerHTML=sh.notes.map(n=>`<li>${n.replace(/</g,'&lt;')}</li>`).join('');
 const r=document.getElementById('rvw');r.innerHTML=sh.review.length?'<h2>審查結果</h2><table><tr><th>規則</th><th>判定</th><th>項目／發現</th></tr>'+sh.review.map(x=>`<tr><td>${x.rule}</td><td class="s-${x.status}">${x.status}</td><td><b>${x.item}</b><br>${x.finding}<br><small>${x.basis}</small></td></tr>`).join('')+'</table>':''}
let drag=null;cv.onmousedown=e=>{drag=[e.clientX,e.clientY];cv.style.cursor='grabbing'};window.onmouseup=()=>{drag=null;cv.style.cursor='grab'};
window.onmousemove=e=>{if(!drag)return;view.x+=(e.clientX-drag[0])*dpr;view.y+=(e.clientY-drag[1])*dpr;drag=[e.clientX,e.clientY];draw()};
cv.onwheel=e=>{e.preventDefault();const r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)*dpr,my=(e.clientY-r.top)*dpr,f=e.deltaY<0?1.15:1/1.15;view.x=mx-(mx-view.x)*f;view.y=my-(my-view.y)*f;view.s*=f;draw()};
cv.ondblclick=fit;document.getElementById('fit').onclick=fit;
let tp=null;cv.addEventListener('touchstart',e=>{tp=[...e.touches].map(t=>[t.clientX,t.clientY])},{passive:true});
cv.addEventListener('touchmove',e=>{e.preventDefault();const t=[...e.touches].map(t=>[t.clientX,t.clientY]);if(t.length===1&&tp&&tp.length===1){view.x+=(t[0][0]-tp[0][0])*dpr;view.y+=(t[0][1]-tp[0][1])*dpr}
 else if(t.length===2&&tp&&tp.length===2){const d0=Math.hypot(tp[0][0]-tp[1][0],tp[0][1]-tp[1][1]),d1=Math.hypot(t[0][0]-t[1][0],t[0][1]-t[1][1]),f=d1/d0,r=cv.getBoundingClientRect(),mx=((t[0][0]+t[1][0])/2-r.left)*dpr,my=((t[0][1]+t[1][1])/2-r.top)*dpr;view.x=mx-(mx-view.x)*f;view.y=my-(my-view.y)*f;view.s*=f}tp=t;draw()},{passive:false});
document.getElementById('png').onclick=()=>{const a=document.createElement('a');a.download=D.sheets[S].dwg+'.png';a.href=cv.toDataURL('image/png');a.click()};
window.onresize=resize;panel();resize();fit();
</script></body></html>
