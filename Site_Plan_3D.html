function proj(p,B,W,H){const d=[p[0]-B.eye[0],p[1]-B.eye[1],p[2]-B.eye[2]];const z=d[0]*B.f[0]+d[1]*B.f[1]+d[2]*B.f[2];if(z<0.5)return null;
 const fl=Math.min(W,H)*1.15;return[W/2+(d[0]*B.r[0]+d[1]*B.r[1]+d[2]*B.r[2])*fl/z,H/2-(d[0]*B.u[0]+d[1]*B.u[1]+d[2]*B.u[2])*fl/z,z]}
function draw(){const W=cv.width,H=cv.height,B=basis();const sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#cfe3f2');sky.addColorStop(1,'#f4f6f0');g.fillStyle=sky;g.fillRect(0,0,W,H);
 const items=[];
 for(const f of S.faces){const pp=f.p.map(p=>proj(p,B,W,H));if(pp.some(q=>!q))continue;
  const a=f.p[0],b=f.p[1],c=f.p[2];let n=norm([(b[1]-a[1])*(c[2]-a[2])-(b[2]-a[2])*(c[1]-a[1]),(b[2]-a[2])*(c[0]-a[0])-(b[0]-a[0])*(c[2]-a[2]),(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0])]);
  const cen=[0,1,2].map(k=>f.p.reduce((s,p)=>s+p[k],0)/f.p.length);const tv=[B.eye[0]-cen[0],B.eye[1]-cen[1],B.eye[2]-cen[2]];if(n[0]*tv[0]+n[1]*tv[1]+n[2]*tv[2]<0)n=n.map(x=>-x);
  const sh=0.55+0.45*Math.max(0,n[0]*LIGHT[0]+n[1]*LIGHT[1]+n[2]*LIGHT[2]);const flat=Math.abs(n[2])>0.99&&cen[2]<0.1;
  items.push({k:'f',z:pp.reduce((s,q)=>s+q[2],0)/pp.length+(flat?1e5-cen[2]*10:0),pp,c:hexrgb(f.c),sh,a:f.a})}
 for(const l of S.lines){for(let i=1;i<l.p.length;i++){const p0=proj(l.p[i-1],B,W,H),p1=proj(l.p[i],B,W,H);if(!p0||!p1)continue;const ground=l.p[i][2]<0.1;items.push({k:'l',z:(p0[2]+p1[2])/2+(ground?1e5-1:0)-0.01,p0,p1,c:l.c,w:l.w,d:l.d})}}
 items.sort((a,b)=>b.z-a.z);const solid=items.filter(it=>it.k==='f'&&it.a>0.6&&it.z<1e5);
 for(const it of items){if(it.k==='f'){g.beginPath();it.pp.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();
   const c=it.c.map(v=>Math.round(v*it.sh));g.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${it.a})`;g.fill();g.strokeStyle=`rgba(${Math.round(c[0]*.7)},${Math.round(c[1]*.7)},${Math.round(c[2]*.7)},${Math.min(1,it.a+.2)})`;g.lineWidth=0.6*dpr;g.stroke()}
  else{g.beginPath();g.moveTo(it.p0[0],it.p0[1]);g.lineTo(it.p1[0],it.p1[1]);g.strokeStyle=it.c;g.lineWidth=it.w*dpr*1.3;g.setLineDash(it.d?[7*dpr,5*dpr]:[]);g.stroke();g.setLineDash([])}}
 if(showLb){const lbs=S.labels.map(t=>({t,q:proj(t.p,B,W,H)})).filter(o=>o.q).map(o=>(o.hid=solid.some(f=>f.z<o.q[2]-0.5&&inPoly(o.q,f.pp)),o)).sort((a,b)=>b.q[2]-a.q[2]);const placed=[];
  g.font=`600 ${12*dpr}px "Noto Sans TC","Microsoft JhengHei",sans-serif`;g.textAlign='center';g.textBaseline='middle';
  for(const o of lbs){const w=g.measureText(o.t.s).width+10*dpr,h=18*dpr;let x=o.q[0],y=o.q[1]-14*dpr;
   for(let k=0;k<6&&placed.some(r=>Math.abs(r[0]-x)<(r[2]+w)/2&&Math.abs(r[1]-y)<h);k++)y-=h;placed.push([x,y,w]);
   g.strokeStyle='rgba(60,60,60,.55)';g.lineWidth=1*dpr;g.beginPath();g.moveTo(o.q[0],o.q[1]);g.lineTo(x,y+h/2);g.stroke();
   g.globalAlpha=o.hid?0.35:1;g.fillStyle='rgba(255,255,255,.88)';g.fillRect(x-w/2,y-h/2,w,h);g.strokeRect(x-w/2,y-h/2,w,h);g.fillStyle=o.t.c;g.fillText(o.t.s,x,y);g.globalAlpha=1}}
 // 指北
 const n0=proj([S.center[0],S.center[1],0],B,W,H),n1=proj([S.center[0]+Math.sin(S.north*Math.PI/180)*10,S.center[1]+Math.cos(S.north*Math.PI/180)*10,0],B,W,H);
 if(n0&&n1){const a=Math.atan2(n1[1]-n0[1],n1[0]-n0[0]),cx=W-48*dpr,cy=48*dpr,r=22*dpr;g.fillStyle='rgba(255,255,255,.9)';g.beginPath();g.arc(cx,cy,r+6*dpr,0,7);g.fill();g.strokeStyle='#333';g.stroke();
  g.fillStyle='#222';g.beginPath();g.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);g.lineTo(cx+Math.cos(a+2.6)*r*.5,cy+Math.sin(a+2.6)*r*.5);g.lineTo(cx+Math.cos(a-2.6)*r*.5,cy+Math.sin(a-2.6)*r*.5);g.fill();
  g.font=`700 ${12*dpr}px sans-serif`;g.fillText('N',cx+Math.cos(a)*(r+13*dpr),cy+Math.sin(a)*(r+13*dpr))}}
function resize(){const r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;draw()}
let drag=null;cv.onmousedown=e=>{drag={x:e.clientX,y:e.clientY,s:e.shiftKey}};window.onmouseup=()=>drag=null;
window.onmousemove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
 if(drag.s||e.shiftKey){const B=basis(),k=cam.dist/700;cam.tx-=(B.r[0]*dx-0)*k;cam.ty-=(B.r[1]*dx)*k;const fx=B.f[0],fy=B.f[1],l=Math.hypot(fx,fy)||1;cam.tx+=fx/l*dy*k;cam.ty+=fy/l*dy*k}
 else{cam.yaw-=dx*0.006;cam.pitch=Math.min(1.55,Math.max(0.12,cam.pitch+dy*0.005))}draw()};

 else if(t.length===2&&tp&&tp.length===2){const d0=Math.hypot(tp[0][0]-tp[1][0],tp[0][1]-tp[1][1]),d1=Math.hypot(t[0][0]-t[1][0],t[0][1]-t[1][1]);cam.dist*=d0/d1}tp=t;draw()},{passive:false});
